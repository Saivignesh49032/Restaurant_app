<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Map</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="map-page">
    <header>
        <div class="header-content">
            <h1><i class="fas fa-map-marked-alt"></i> {{ map_title }}</h1>
            <nav>
                <a href="/" class="nav-btn"><i class="fas fa-arrow-left"></i> Back to Search</a>
                <a href="/map" class="nav-btn"><i class="fas fa-globe"></i> Full Map</a>
            </nav>
        </div>
    </header>

    <main class="map-layout">
        <div class="map-controls">
            <button id="center-map" class="control-btn">
                <i class="fas fa-crosshairs"></i> Center Map
            </button>
            <button id="cluster-toggle" class="control-btn">
                <i class="fas fa-layer-group"></i> Toggle Clustering
            </button>
        </div>
        
        <div class="map-container">
            {{ map_content | safe }}
        </div>

        <div id="restaurant-info" class="info-panel">
            <!-- Restaurant details will be populated by JavaScript -->
        </div>
    </main>

    <script>
        // Add map control handlers
        document.getElementById('center-map').addEventListener('click', () => {
            // The map object is available as 'map' in the embedded Folium HTML
            try {
                const bounds = map.getBounds();
                map.fitBounds(bounds);
            } catch (e) {
                console.error('Error centering map:', e);
            }
        });

        document.getElementById('cluster-toggle').addEventListener('click', function() {
            try {
                const clusters = document.querySelectorAll('.marker-cluster');
                clusters.forEach(cluster => {
                    cluster.style.display = cluster.style.display === 'none' ? '' : 'none';
                });
                this.classList.toggle('active');
            } catch (e) {
                console.error('Error toggling clusters:', e);
            }
        });
    </script>
</body>
</html>
